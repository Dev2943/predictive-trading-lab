# Local stack that reproduces production as closely as practical.
#
# Same images, same non-root users, same health checks, same single backend
# worker. The differences that remain are stated rather than papered over:
# origins point at localhost, and the results volume is a local one rather than
# a platform disk.
#
#   docker compose -f frontend/docker-compose.yml up --build
#
# Run from the REPOSITORY ROOT: the backend build context is the root because
# the bindings compile against the engine.

services:
  backend:
    build:
      context: ..
      dockerfile: frontend/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # development, so the settings validator permits localhost origins. A
      # production deployment sets PTL_ENV=production and real origins.
      PTL_ENV: development
      PTL_LOG_LEVEL: info
      PTL_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      PTL_RESULTS: /app/results
      PTL_MARKET_PROVIDER: replay
      # Live market data is opt-in and needs credentials. Left unset here so the
      # stack runs for anyone who clones it.
      # PTL_MARKET_PROVIDER: alpaca
      # PTL_ALPACA_KEY: ${PTL_ALPACA_KEY}
      # PTL_ALPACA_SECRET: ${PTL_ALPACA_SECRET}
    volumes:
      - session-results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time, so changing it needs a rebuild.
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  session-results:
